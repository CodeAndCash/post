<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Новый пост</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0e0f12;--card:#17191e;--line:#2a2e36;--fg:#e8e9ec;--hint:#8b909a;--accent:#7aa7ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px 16px 110px;max-width:560px;margin-inline:auto}
header{display:flex;align-items:center;gap:10px}
h1{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:0;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--accent);font-size:14px;padding:4px}
.label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--hint);margin:26px 0 8px}
.label>span:first-child{flex:1}
.tool{width:32px;height:28px;border:1px solid var(--line);border-radius:8px;background:none}
textarea,input[type=text],input:not([type]){width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:none}
textarea:focus,input:focus{border-color:var(--accent)}
textarea{min-height:140px;resize:vertical}
.pick,.add{width:100%;padding:12px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--accent)}
.file{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:8px 8px 8px 14px;font-size:14px}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 36px;gap:6px 8px;margin-bottom:12px}
.row input:nth-child(1){grid-column:1;grid-row:1}
.row input:nth-child(2){grid-column:1;grid-row:2}
.x{grid-column:2;grid-row:1/3;border:0;border-radius:12px;background:var(--card);color:var(--hint)}
.bubble{background:var(--card);border-radius:16px;overflow:hidden;max-width:420px}
.m img,.m video{display:block;width:100%;max-height:320px;object-fit:cover}
.cap{padding:10px 14px;word-break:break-word}
.cap:empty{display:none}
.btns{display:grid;gap:4px;padding:0 6px 6px}
.btns:empty{display:none}
.btn{text-align:center;padding:10px;border-radius:10px;background:#242830;color:var(--accent);font-weight:600;font-size:15px}
.empty{padding:18px 14px;color:var(--hint);font-size:14px}
.sw{display:flex;align-items:center;gap:10px;margin-top:22px;padding:12px 14px;background:var(--card);border-radius:12px;font-size:15px}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
</style>
</head>
<body>
<header><h1>Новый пост</h1><button class="link" id="clr" type="button">Очистить</button></header>

<div class="label"><span>Медиа</span></div>
<input type="file" id="file" accept="image/*,video/*" hidden>
<button class="pick" id="pick" type="button">Добавить фото, видео или GIF</button>
<div class="file" id="finfo" hidden><span id="fname"></span><button class="link" id="frm" type="button">Убрать</button></div>

<div class="label"><span>Текст</span>
  <button class="tool" data-t="b" type="button"><b>B</b></button>
  <button class="tool" data-t="i" type="button"><i>I</i></button>
  <span id="cnt"></span></div>
<textarea id="ta" placeholder="Что напишем?"></textarea>

<div class="label"><span>Кнопки (на всю ширину, до 3)</span></div>
<div id="rows"></div>
<button class="add" id="add" type="button">Добавить кнопку</button>
<label class="sw"><input type="checkbox" id="tochan"><span>Опубликовать сразу в канал</span></label>

<div class="label"><span>Как будет выглядеть</span></div>
<div class="bubble"><div class="m" id="m" hidden></div><div class="cap" id="cap"></div><div class="btns" id="btns"></div><div class="empty" id="empty">Здесь появится пост</div></div>

<script>
const tg=window.Telegram&&window.Telegram.WebApp;
const $=id=>document.getElementById(id);
const MB=1048576;
const blank=()=>({text:'',buttons:[{t:'',u:''}]});
let st=blank(),file=null,url=null,busy=false;
try{Object.assign(st,JSON.parse(localStorage.getItem('draft')||'{}'))}catch(e){}
if(!Array.isArray(st.buttons)||!st.buttons.length)st.buttons=[{t:'',u:''}];
const ta=$('ta');ta.value=st.text||'';

const limit=()=>file?1024:4096;
const fmt=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/&lt;(\/?)(b|i)&gt;/g,'<$1$2>').replace(/\n/g,'<br>');
const vis=s=>s.replace(/<\/?(b|i)>/g,'');
function fail(m){tg?tg.showAlert(m):alert(m)}

function sync(){
  st.text=ta.value;
  const n=vis(st.text).length,l=limit();
  $('cnt').textContent=n+' / '+l;
  $('cnt').style.color=n>l?'#ff6b6b':'';
  $('cap').innerHTML=fmt(st.text);
  $('btns').innerHTML='';
  st.buttons.forEach(b=>{if(b.t.trim()){const d=document.createElement('div');d.className='btn';d.textContent=b.t;$('btns').appendChild(d)}});
  $('empty').hidden=!!(file||st.text.trim()||$('btns').children.length);
  try{localStorage.setItem('draft',JSON.stringify(st))}catch(e){}
}
function setFile(f){
  if(url){URL.revokeObjectURL(url);url=null}
  file=f;const m=$('m');m.innerHTML='';
  m.hidden=!f;$('finfo').hidden=!f;$('pick').hidden=!!f;
  if(f){
    url=URL.createObjectURL(f);
    const v=f.type.startsWith('video/');
    const el=document.createElement(v?'video':'img');el.src=url;
    if(v){el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true}
    m.appendChild(el);
    $('fname').textContent=f.name+' · '+(f.size/MB).toFixed(1)+' МБ';
  }
  sync();
}
function rows(){
  const box=$('rows');box.innerHTML='';
  st.buttons.forEach((b,i)=>{
    const r=document.createElement('div');r.className='row';
    const t=document.createElement('input');t.placeholder='Текст кнопки';t.maxLength=64;t.value=b.t;
    const u=document.createElement('input');u.placeholder='Ссылка, например https://t.me/channel';u.inputMode='url';u.value=b.u;
    const x=document.createElement('button');x.type='button';x.className='x';x.textContent='✕';
    t.oninput=()=>{b.t=t.value;sync()};
    u.oninput=()=>{b.u=u.value;sync()};
    x.onclick=()=>{st.buttons.splice(i,1);if(!st.buttons.length)st.buttons=[{t:'',u:''}];rows();sync()};
    r.append(t,u,x);box.appendChild(r);
  });
  $('add').hidden=st.buttons.length>=3;
}
function wrap(tag){
  const a=ta.selectionStart,b=ta.selectionEnd,v=ta.value;
  ta.value=v.slice(0,a)+'<'+tag+'>'+v.slice(a,b)+'</'+tag+'>'+v.slice(b);
  ta.focus();ta.setSelectionRange(a+tag.length+2,b+tag.length+2);sync();
}
document.querySelectorAll('[data-t]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>wrap(b.dataset.t)});
$('pick').onclick=()=>$('file').click();
$('frm').onclick=()=>setFile(null);
$('file').onchange=e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  const t=f.type||'';
  if(!t.startsWith('image/')&&!t.startsWith('video/'))return fail('Поддерживаются фото, видео и GIF.');
  const max=(t.startsWith('image/')&&t!=='image/gif'?10:50)*MB;
  if(f.size>max)return fail('Файл слишком большой: фото до 10 МБ, видео и GIF до 50 МБ.');
  setFile(f);
};
$('add').onclick=()=>{st.buttons.push({t:'',u:''});rows();sync()};
$('clr').onclick=()=>{st=blank();ta.value='';setFile(null);rows();sync()};
ta.oninput=sync;
$('tochan').onchange=()=>{if(tg)tg.MainButton.setText($('tochan').checked?'Опубликовать в канал':'Создать пост')};

async function submit(){
  if(busy)return;
  const text=ta.value.trim();
  if(!text&&!file)return fail('Добавь текст или медиа.');
  if(vis(text).length>limit())return fail('Текст длиннее '+limit()+' символов.');
  const buttons=[];
  for(const b of st.buttons){
    const t=b.t.trim();let u=b.u.trim();
    if(!t&&!u)continue;
    if(!t||!u)return fail('У кнопки должны быть и текст, и ссылка.');
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(u))u='https://'+u;
    if(!/^(https?|tg):\/\//i.test(u))return fail('Ссылка должна начинаться с https://');
    buttons.push({t,u});
  }
  const chan=$('tochan').checked;
  if(chan&&!await new Promise(res=>tg?tg.showConfirm('Опубликовать пост в канал?',res):res(confirm('Опубликовать пост в канал?'))))return;
  busy=true;if(tg)tg.MainButton.showProgress();
  try{
    const fd=new FormData();
    fd.append('initData',tg?tg.initData:'');
    fd.append('text',text);
    fd.append('buttons',JSON.stringify(buttons));
    fd.append('target',chan?'channel':'me');
    if(file)fd.append('media',file,file.name);
    const r=await fetch('/api/post',{method:'POST',body:fd});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'Не удалось отправить, код '+r.status);
    if(j.note)await new Promise(res=>tg?tg.showAlert(j.note,res):(alert(j.note),res()));
    tg?tg.close():alert('Пост отправлен');
  }catch(e){fail(e.message||'Ошибка сети')}
  finally{busy=false;if(tg)tg.MainButton.hideProgress()}
}
if(tg){
  tg.ready();tg.expand();
  try{tg.setHeaderColor('#0e0f12');tg.setBackgroundColor('#0e0f12')}catch(e){}
  try{tg.MainButton.setParams({text:'Создать пост',color:'#7aa7ff',text_color:'#0e0f12',is_visible:true})}catch(e){tg.MainButton.setText('Создать пост').show()}
  tg.MainButton.onClick(submit);
}
rows();sync();
</script>
</body>
</html>
